[project]
name = "learning-companion"
version = "0.1.0"
description = "Learning Companion Chatbot: a LangChain-backed, OpenAI-compatible chat service for Open WebUI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "langchain>=1.4.6",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.15",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
learning-companion = "learning_companion.main:run"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
